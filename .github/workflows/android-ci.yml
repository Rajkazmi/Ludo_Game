name: Android CI

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-android:
    name: Lint, test, and build Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions

      - name: Validate Firebase database rules JSON
        run: |
          node -e "const fs = require('node:fs'); const config = JSON.parse(fs.readFileSync('database.rules.json', 'utf8')); if (!config.rules || typeof config.rules !== 'object' || Array.isArray(config.rules)) throw new Error('database.rules.json must contain a rules object');"

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand --ci

      - name: Test Cloud Functions game rules
        run: npm test --prefix functions

      - name: Build Android debug APK
        working-directory: android
        run: bash gradlew --no-daemon -PreactNativeArchitectures=arm64-v8a :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ludo-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
