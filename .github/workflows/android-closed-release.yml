name: Android closed testing release

on:
  workflow_dispatch:
    inputs:
      confirm_closed_test_upload:
        description: Upload version 1.0.1 to the Google Play closed testing track
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-closed-testing:
    name: Validate, build, and upload closed testing release
    if: github.ref == 'refs/heads/main' && inputs.confirm_closed_test_upload
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand --ci

      - name: Configure release signing
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64"
          test -n "$ANDROID_UPLOAD_STORE_PASSWORD"
          test -n "$ANDROID_UPLOAD_KEY_ALIAS"
          test -n "$ANDROID_UPLOAD_KEY_PASSWORD"
          umask 077
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_UPLOAD_STORE_PASSWORD" \
            "$ANDROID_UPLOAD_KEY_ALIAS" \
            "$ANDROID_UPLOAD_KEY_PASSWORD" > android/keystore.properties

      - name: Build signed Android App Bundle
        working-directory: android
        run: bash gradlew --no-daemon :app:bundleRelease

      - name: Upload to Google Play closed testing
        uses: r0adkll/upload-google-play@eb49699984a39f23558439581660aa6f088acfd6
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.gamegape.ludokingdom
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: closed
          status: completed
