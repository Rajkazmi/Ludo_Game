name: Firebase backend deployment

on:
  workflow_dispatch:
    inputs:
      confirm_firebase_backend_deploy:
        description: Confirm the selected Firebase backend deployment
        required: true
        type: boolean
        default: false
      deployment_target:
        description: Deploy Functions first; lock direct database writes only after app rollout
        required: true
        type: choice
        options:
          - functions
          - database-rules
        default: functions

permissions:
  contents: read
  id-token: write

jobs:
  deploy-firebase-backend:
    name: Validate and deploy Firebase backend
    if: github.ref == 'refs/heads/main' && inputs.confirm_firebase_backend_deploy
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions

      - name: Validate Firebase database rules JSON
        run: |
          node -e "const fs = require('node:fs'); const config = JSON.parse(fs.readFileSync('database.rules.json', 'utf8')); if (!config.rules || typeof config.rules !== 'object' || Array.isArray(config.rules)) throw new Error('database.rules.json must contain a rules object');"

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand --ci

      - name: Test Cloud Functions game rules
        run: npm test --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy Cloud Functions
        if: inputs.deployment_target == 'functions'
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
        run: |
          test -n "$FIREBASE_PROJECT_ID"
          test -n "$FIREBASE_DATABASE_URL"
          printf 'RTDB_DATABASE_URL=%s\n' "$FIREBASE_DATABASE_URL" > "functions/.env.${FIREBASE_PROJECT_ID}"
          npx --yes firebase-tools@15.33.0 deploy \
            --only functions \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive

      - name: Lock direct client writes to match rooms
        if: inputs.deployment_target == 'database-rules'
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          test -n "$FIREBASE_PROJECT_ID"
          npx --yes firebase-tools@15.33.0 deploy \
            --only database \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
